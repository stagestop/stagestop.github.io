# Where things are
source: .
destination: ./_site
plugins_dir: ./_plugins
layouts_dir: ./_layouts
data_dir: ./_data
collections:
  - sections
  - training-classes

# Handling Reading
safe: false
include:
  - ".htaccess"
  - "_pages"
exclude:
  - README.md
  - MODERNIZATION.md
  - CONTENT_AUDIT.md
  - FRONTEND_AUDIT.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - .dockerignore
keep_files: [".git", ".svn"]
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Filtering Content
show_drafts: null
limit_posts: 0
future: true
unpublished: false

# Plugins
plugins: []

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"

# Serving
detach: false
port: 4000
host: 127.0.0.1
baseurl: "" # does not include hostname
url: "https://stagestopgunshop.com"

# Outputting
permalink: /:title.html
timezone: null

quiet: false
defaults:
  - scope:
      path: ""
      type: sections
    values:
      layout: section-default
      right-class: col-md-6
      left-class: col-md-6
  - scope:
      path: ""
      type: training-classes
    values:
      layout: training-class-default
  - scope:
      page: ""
      type: pages
    values:
      header-image: /images/hero/hero1.jpg

# Markdown Processor
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed
