---
---
<section class="portfolio-type2 no-gutter no-padding ">
    <h2 class="section-title text-center mb-0">{{ page.title | upcase}}</h2>
    <div class="spacer spacer-line border-primary">&nbsp;</div>

    <div class="container-fluid">
        <ul class="row portfolio list-unstyled mb-0 gallery-grid sponsor-lightbox lightbox">
            {% for sponsor in site.data.sponsors %}
            <!-- project -->
            <li class="col-md-3 project">
                <div class="effect effect-2 clearfix">
                    <div class="img">
                        <img class="img-fluid" src="{{ sponsor.image }}" alt="image of {{ sponsor.name }} logo.">
                        <div class="overlay">
                            <a href="#SPNSR-{{ sponsor.id }}" class="inline-lightbox expand">+</a>
                        </div><!-- / overlay -->
                    </div><!-- / img -->
                </div><!-- / effect-2 -->
                <div id="SPNSR-{{ sponsor.id }}" class="white-popup gallery-inline-content" hidden>
                    <img class="img-fluid" src="{{ sponsor.image }}" alt="image of {{ sponsor.name }} logo.">
                    {{ sponsor.summary | markdownify }}
                </div>
            </li><!-- / project -->
            {% endfor %}
        </ul> <!-- / portfolio -->
    </div><!-- / container-fluid -->
    {{ page.content }}
</section>
